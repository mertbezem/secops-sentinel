version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: secops_postgres
    restart: always
    environment:
      POSTGRES_USER: secops
      POSTGRES_PASSWORD: secops_secure_password
      POSTGRES_DB: secops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secops -d secops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secops_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://secops:secops_secure_password@postgres:5432/secops_db
      CORS_ORIGINS: '["*"]'
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data

volumes:
  pgdata:
