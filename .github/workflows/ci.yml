name: SecOps Sentinel CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.110.0" "uvicorn[standard]>=0.28.0" "pydantic>=2.6.0" "pydantic-settings>=2.2.0" "sqlalchemy>=2.0.28" "alembic>=1.13.1" "pandas>=2.2.1" "python-multipart>=0.0.9" "pytest>=8.1.0" "pytest-cov>=4.1.0" "pytest-asyncio>=0.23.0" "httpx>=0.27.0" "ruff>=0.3.0" "mypy>=1.9.0"

      - name: Run Ruff (Linter)
        run: ruff check backend

      - name: Run Mypy (Type Check)
        run: mypy backend

      - name: Run Pytest & Coverage
        run: pytest backend/tests --cov=backend/app --cov-report=term-missing --cov-report=xml
